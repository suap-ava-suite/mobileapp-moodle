<div class="course-loading" role="status" aria-live="polite" aria-busy="true" [attr.aria-label]="message">
    <button
        type="button"
        class="course-loading__back"
        aria-label="Voltar ao Painel AVA"
        [disabled]="cancellationStarted()"
        (click)="requestCancel()">
        <span aria-hidden="true">&#8592;</span>
        <span>Painel</span>
    </button>

    <main class="course-loading__content">
        <p class="course-loading__message">{{ message }}</p>
        @if (courseName) {
            <p class="course-loading__course-name">{{ courseName }}</p>
        }
        <div class="course-loading__skeleton" aria-hidden="true">
            <span class="course-loading__skeleton-card"></span>
            <span class="course-loading__skeleton-card"></span>
            <span class="course-loading__skeleton-card"></span>
        </div>
    </main>
</div>
