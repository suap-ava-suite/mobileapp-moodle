<div class="course-loading" role="status" aria-live="polite" aria-busy="true" aria-label="Abrindo sua disciplina">
    <button
        type="button"
        class="course-loading__back"
        aria-label="Voltar ao Painel AVA"
        [disabled]="cancellationStarted()"
        (click)="requestCancel()">
        <span aria-hidden="true">&#8592;</span>
        <span>Painel</span>
    </button>

    <main class="course-loading__content">
        <div class="course-loading__brand" aria-hidden="true">
            @if (logoUrl) {
                <img class="course-loading__logo" [src]="logoUrl" alt="" />
            }
            <span class="course-loading__spinner"></span>
        </div>
        <p class="course-loading__message">Abrindo sua disciplina...</p>
        @if (courseName) {
            <p class="course-loading__course-name">{{ courseName }}</p>
        }
    </main>
</div>
