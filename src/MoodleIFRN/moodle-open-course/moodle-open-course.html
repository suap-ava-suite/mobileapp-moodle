<ion-content
    class="moodle-open-course"
    [class.moodle-open-course--busy]="phase === 'loading' || phase === 'waiting-browser'">

    @if (phase === 'loading' || phase === 'waiting-browser') {
        <!-- Ponte intencionalmente sem UI: a verificação e o handoff acontecem em silêncio. -->
        <div class="moodle-open-course__silent" aria-live="polite" aria-busy="true"></div>
    } @else {
        <header class="moodle-open-course__header">
            <ion-button
                class="moodle-open-course__back"
                fill="clear"
                (click)="goBack()"
                [disabled]="loading"
                aria-label="Voltar ao painel">
                <ion-icon name="arrow-back-outline" slot="icon-only"></ion-icon>
            </ion-button>
            <h1 id="moodle-open-course-title">Abrir curso</h1>
        </header>

        <main class="moodle-open-course__content" aria-labelledby="moodle-open-course-title">
            <section class="moodle-open-course__card">
                <h2>{{ courseName || ('Curso ' + courseId) }}</h2>

                @if (formError) {
                    <p class="moodle-open-course__error" role="alert">
                        {{ formError }}
                    </p>
                }

                <div class="moodle-open-course__actions">
                    <ion-button
                        expand="block"
                        class="moodle-open-course__button"
                        (click)="retryConnect()"
                        [disabled]="loading || !courseId">
                        @if (loading) {
                            <ion-spinner name="crescent" aria-hidden="true"></ion-spinner>
                        } @else {
                            Tentar novamente
                        }
                    </ion-button>

                    <ion-button
                        expand="block"
                        fill="outline"
                        class="moodle-open-course__button"
                        (click)="goBack()"
                        [disabled]="loading">
                        Voltar ao Painel AVA
                    </ion-button>
                </div>
            </section>
        </main>
    }
</ion-content>
