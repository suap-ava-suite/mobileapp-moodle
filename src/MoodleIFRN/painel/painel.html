<ion-content [fullscreen]="true" [scrollY]="false" [scrollX]="false" class="painel-page-content">
    <iframe
        #painelFrame
        *ngIf="safePainelUrl"
        [src]="safePainelUrl"
        class="painel-iframe"
        title="Painel AVA"
        allow="fullscreen"
        (load)="onIframeLoad()">
    </iframe>
</ion-content>

<ion-modal
    [isOpen]="internalPageScreenOpen"
    [backdropDismiss]="false"
    cssClass="ifrn-suap-profile-modal"
    (didDismiss)="onInternalPageScreenDismiss()">
    <ng-template>
        <ion-header class="suap-profile-screen__header">
            <ion-toolbar>
                <ion-buttons slot="start">
                    <ion-button aria-label="Voltar ao Painel" (click)="closeInternalPageScreen()">
                        <ion-icon name="arrow-back-outline" slot="icon-only"></ion-icon>
                    </ion-button>
                </ion-buttons>
                <ion-title>{{ internalPageTitle }}</ion-title>
            </ion-toolbar>
        </ion-header>
        <ion-content class="suap-profile-screen__content" [fullscreen]="true">
            @if (internalPageLoading) {
                <div class="suap-profile-screen__state" role="status" aria-live="polite">
                    <ion-spinner name="crescent" aria-label="Carregando conteúdo"></ion-spinner>
                    <p>Abrindo {{ internalPageTitle }}…</p>
                </div>
            } @else if (internalPageError) {
                <div class="suap-profile-screen__state" role="alert">
                    <ion-icon name="alert-circle-outline" aria-hidden="true"></ion-icon>
                    <p>{{ internalPageError }}</p>
                    <div class="suap-profile-screen__actions">
                        <ion-button expand="block" (click)="retryInternalPage()">Tentar novamente</ion-button>
                        <ion-button expand="block" fill="outline" (click)="closeInternalPageScreen()">
                            Voltar ao Painel
                        </ion-button>
                    </div>
                </div>
            }
        </ion-content>
    </ng-template>
</ion-modal>
