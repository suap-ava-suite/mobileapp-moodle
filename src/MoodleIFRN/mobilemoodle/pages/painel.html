<!-- Partial Ionic · Painel AVA (lista de cursos) -->
<template id="tpl-painel">
    <ion-refresher slot="fixed" id="painel-refresher">
        <ion-refresher-content></ion-refresher-content>
    </ion-refresher>

    <div class="painel-page">
        <div class="tabs-row" id="painel-tabs" role="tablist" aria-label="Abas do painel">
            <button type="button" class="ava-tab is-active" data-tab="cursos" role="tab" aria-selected="true">
                Meus cursos
                <span class="ava-tab__badge" id="tab-badge-cursos">0</span>
            </button>
            <button type="button" class="ava-tab" data-tab="diarios" role="tab" aria-selected="false" disabled>
                Diários
            </button>
            <button type="button" class="ava-tab" data-tab="autoinscricoes" role="tab" aria-selected="false" disabled>
                Autoinscrição
            </button>
        </div>

        <section class="page-intro">
            <h2>Meus cursos</h2>
            <p id="painel-intro-text">Carregando...</p>
        </section>

        <div class="card-container" id="painel-cards"></div>
    </div>
</template>

<!-- Card AVA (estrutura igual ao theme_ifrn25) -->
<template id="tpl-painel-card">
    <ion-card class="painel-card">
        <ion-card-content>
            <a class="painel-card-link" href="#">
                <h2 class="painel-card-title"></h2>
                <span class="painel-card-header-shortname"></span>
            </a>
            <div class="painel-card-details">
                <div class="painel-card-details-progress">
                    <div class="painel-progress-bar-container">
                        <div class="painel-progress-bar" style="width: 0%"></div>
                    </div>
                    <span class="painel-progress-label">0% concluído</span>
                </div>
                <div class="painel-card-details-info">
                    <div class="painel-card-info-icon">
                        <ion-icon name="school-outline"></ion-icon>
                        <span class="painel-card-header-env">AVA Acadêmico</span>
                    </div>
                    <div class="painel-card-details-info-published">
                        <ion-icon name="checkmark-circle-outline"></ion-icon>
                        <span>Publicado</span>
                    </div>
                    <button type="button" class="painel-card-details-info-favourite" aria-label="Favorito">
                        <ion-icon name="star-outline"></ion-icon>
                    </button>
                </div>
            </div>
        </ion-card-content>
    </ion-card>
</template>

<template id="tpl-painel-skeleton">
    <div class="card-container loading" aria-hidden="true">
        <div class="card-skeleton">
            <div class="header-skeleton">
                <div class="title-skeleton"></div>
                <div class="subtitle-skeleton"></div>
            </div>
            <div class="footer-skeleton">
                <div class="progress-bar-skeleton-container">
                    <div class="progress-bar-skeleton"></div>
                    <div class="progress-text-skeleton"></div>
                </div>
                <div class="itens-skeleton">
                    <div class="badge-skeleton"></div>
                    <div class="badge-skeleton"></div>
                    <div class="icon-skeleton"></div>
                </div>
            </div>
        </div>
        <div class="card-skeleton">
            <div class="header-skeleton">
                <div class="title-skeleton"></div>
                <div class="subtitle-skeleton"></div>
            </div>
            <div class="footer-skeleton">
                <div class="progress-bar-skeleton-container">
                    <div class="progress-bar-skeleton"></div>
                    <div class="progress-text-skeleton"></div>
                </div>
                <div class="itens-skeleton">
                    <div class="badge-skeleton"></div>
                    <div class="icon-skeleton"></div>
                </div>
            </div>
        </div>
    </div>
</template>

<template id="tpl-empty-cursos">
    <div class="no-data">
        <h3>Nenhum resultado encontrado nesta aba.</h3>
        <p>É possível que a Secretaria Acadêmica ainda não tenha lhe inserido em diário algum; neste caso, aguarde.</p>
    </div>
</template>
