<ion-content class="marketplace-ifrn" [fullscreen]="true" [scrollY]="true">
    <main class="welcome">
        <div class="welcome__background" aria-hidden="true">
            <img [src]="welcomeImageSrc" alt="" />
        </div>

        <header class="welcome__header">
            <div class="brand" aria-label="Instituto Federal do Rio Grande do Norte">
                <span class="brand__symbol" aria-hidden="true">
                    <span class="ifrn-mark">
                        <i class="ifrn-mark__dot"></i>
                        <i class="ifrn-mark__b1"></i>
                        <i class="ifrn-mark__b2"></i>
                        <i class="ifrn-mark__b3"></i>
                        <i class="ifrn-mark__b4"></i>
                        <i class="ifrn-mark__b5"></i>
                        <i class="ifrn-mark__b6"></i>
                        <i class="ifrn-mark__b7"></i>
                        <i class="ifrn-mark__b8"></i>
                        <i class="ifrn-mark__b9"></i>
                    </span>
                </span>
                <span class="brand__name">
                    <strong>INSTITUTO FEDERAL</strong>
                    <small>Rio Grande do Norte</small>
                </span>
            </div>
            <span class="ava-label">AVA IFRN</span>
        </header>

        <section class="welcome__content" aria-labelledby="welcome-title">
            <p class="welcome__eyebrow">Ambiente Virtual de Aprendizagem</p>
            <h1 id="welcome-title">
                O IFRN sempre<br />
                <span>com você.</span>
            </h1>
            <p class="welcome__description">
                Acesse suas disciplinas, atividades e conteúdos acadêmicos
                de onde estiver.
            </p>
        </section>

        <section class="welcome__actions" aria-label="Acesso ao AVA">
            @if (canContinue) {
                <ion-button
                    expand="block"
                    fill="outline"
                    class="btn-continue"
                    (click)="continueSession()">
                    <ion-icon
                        name="person-circle-outline"
                        slot="start"
                        aria-hidden="true">
                    </ion-icon>
                    {{ continueLabel }}
                </ion-button>
            }

            <ion-button expand="block" class="btn-enter" (click)="enterAva()">
                <span>Entrar no AVA</span>
                <ion-icon
                    name="arrow-forward-outline"
                    slot="end"
                    aria-hidden="true">
                </ion-icon>
            </ion-button>

            <button type="button" class="help-link" (click)="openHelp()">
                <ion-icon name="help-circle-outline" aria-hidden="true"></ion-icon>
                Precisa de ajuda para acessar?
            </button>

            <button type="button" class="poc-link" (click)="openMoodlePoc()">
                PoC Moodle (OAuth SUAP)
            </button>
        </section>

        <footer class="welcome__footer">
            <span>© {{ currentYear }} IFRN</span>
            <span aria-hidden="true">•</span>
            <span>Integrado ao SUAP</span>
        </footer>
    </main>
</ion-content>
