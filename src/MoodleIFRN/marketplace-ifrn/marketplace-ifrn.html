<ion-content class="marketplace-ifrn" [fullscreen]="true" [scrollY]="true">
    @if (openingPainel) {
        <div class="marketplace-transition" role="status" aria-live="polite">
            <ion-spinner name="crescent"></ion-spinner>
            <strong>Abrindo Painel AVA…</strong>
        </div>
    }

        <header class="welcome__header"><p>AVA IFRN Mobile</p></header>
        <section class="welcome__body" aria-labelledby="welcome-title">

                <h1 id="welcome-title">Bem-vindo</h1>
                <p class="welcome__description">Acesse suas disciplinas e<br />atividades de onde estiver.</p>
            </div>

<ellipse cx="160" cy="214" rx="126" ry="12" fill="#edf4ef"/>

            <section class="welcome__actions" aria-label="Acesso ao AVA">
                <ion-button expand="block" class="btn-enter" [disabled]="loading"
                    (click)="canContinue ? continueSession() : enterAva()">
                    {{ loading ? 'Autenticando…' : 'Entrar no AVA' }}
                </ion-button>
            </section>
            <footer class="welcome__footer">© {{ currentYear }} IFRN · Integrado ao SUAP</footer>
        </section>
    </main>
</ion-content>
