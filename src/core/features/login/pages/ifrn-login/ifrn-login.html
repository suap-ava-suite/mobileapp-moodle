<ion-content class="login-page">

    <div class="logo">
        <img src="assets/img/logo-ifrn.png" alt="IFRN">
    </div>

    <div class="login-card">

        <h2>Digite a sua senha</h2>

        <ion-item lines="none">
            <ion-input label="IFRN-id" labelPlacement="stacked" [(ngModel)]="username" placeholder="Digite seu usuário">
            </ion-input>
        </ion-item>

        <small>
            IFRN-id é sua matrícula no IFRN, ou seu CPF caso possua acesso externo.
        </small>

        <ion-item lines="none">
            <ion-input type="password" label="Senha" labelPlacement="stacked" [(ngModel)]="password" placeholder="Digite sua senha">
            </ion-input>
        </ion-item>

        <ion-button expand="block" class="btn-login" (click)="login()">
            Entrar
        </ion-button>

        <ion-button expand="block" fill="outline" class="btn-cancel" (click)="clear()">
            Cancelar
        </ion-button>

        <div class="links">

            <a href="" (click)="forgotPassword($event)">
                Esqueci minha senha
            </a>

            <a href="" (click)="help($event)">
                Ficou com dúvidas?
            </a>

        </div>

        <div class="divider">
            <span>ou</span>
        </div>



    </div>

</ion-content>
